  const keep = Object.entries(docCache).sort((a, b) => new Date(b[1].at) - new Date(a[1].at)).slice(0, 6);      // a few recent reports is plenty
  docCache = Object.fromEntries(keep); store.set(DOC_KEY, JSON.stringify(docCache));
};
const docIdle = () => ({status:'idle', text:'', note:'', at:null, sig:null, ai:false, edited:false, busy:false, failedSig:null});
const docs = {};                                                // one report per person and period so changing the period never loses an edited one
const docKey = () => R().id + '|' + range;
const curDoc = () => (docs[docKey()] ||= docIdle());
let docSeq = 0, autoDocTimer = 0;
const ctxEmpty = ctx => !ctx.meta.entries && !ctx.meta.handoffs && !ctx.meta.careLogs;
/* "touched" = a caregiver added, edited or removed something for this person since the starting data. until then the on-device report is all there is. */
const touchedR = () => !!(state.touched && state.touched[R().id]);
const markChanged = rid => { (state.touched ||= {})[rid || R().id] = true; };

/* a short plain summary written on this device from the calculated numbers. the ai one replaces it when it's available */
function localDoctorSummary(ds, es, inc){
  const nm = prof().name;
  if(!es.length) return `No check-ins were logged for ${nm} in this period.`;
  const hard = ds.filter(isHard).length, serious = inc.filter(e => e.severity >= 3).length;
  return [`${nm}’s average mood was ${avg(es.map(e => e.mood)).toFixed(1)} of 5 across ${plural(es.length, 'check-in')} on ${plural(ds.length, 'day')}, with ${plural(hard, 'difficult day')}.`,
    `Medications were logged as given in ${pct(es.filter(e => e.meds).length, es.length)}% of check-ins and the routine was completed in ${pct(es.filter(e => e.routine).length, es.length)}%.`,
    inc.length ? `${plural(inc.length, 'incident')} ${inc.length === 1 ? 'was' : 'were'} logged${serious ? `, ${serious} of them serious (level 3)` : ''}.` : 'No incidents were logged.'].join(' ');
}
/* questions for the doctor that come from the app's own numbers (used when the ai part isn't there) */
function localDoctorQuestions(insights, es, ctx){
  const get = id => insights.find(i => i.id === id), qs = [];
  if(get('sleep') || get('both')) qs.push('Could poor sleep be adding to the harder days, and is there anything we should try?');
  if(get('sched') && !get('both')) qs.push('Could changes to the schedule be adding to the harder days, and how can we ease them?');
  const tod = get('tod'); if(tod) qs.push(`Is there anything we should try for ${tod.big.toLowerCase()}, the hardest part of the day?`);
  if(es.length && es.some(e => !e.meds)) qs.push('Medications were logged as not given at some check-ins. What should caregivers do when a dose is missed?');
  if(ctx.urgent.some(u => /medication/.test(u.text) || /\b(?:pill|dose|meds?)\b/i.test(u.text))) qs.push('A medication problem was noted in the records. What should we check or change?');
  return (qs.length ? qs : ['Do the patterns above change how or when medications should be timed?', 'Any adjustments to the daily routine or support for difficult parts of the day?']).slice(0, 4);
}
function buildDoctorText(out, ctx){
  const p = prof(), {ds, insights} = computeInsights(range), es = ds.flatMap(d => d.es), fix = t => restoreMap(t, ctx.map), L = [], bullets = (items, none) => items.length ? items.map(x => '  - ' + fix(x)) : ['  - ' + none];
  const from = periodStart(range), now = new Date(), hard = ds.filter(isHard), inc = es.filter(e => e.severity > 0), tcs = triggerCounts(ds), signed = ctx.payload.stats.medSignoffs;
  const sev = n => inc.filter(e => e.severity === n).length;
  L.push(`DOCTOR REPORT — ${p.name}${p.age ? ', age ' + p.age : ''}`);
  L.push(`Last ${range} days (${fmtShort(from)} to ${fmtShort(now)}) · prepared ${now.toLocaleDateString([], {year:'numeric', month:'long', day:'numeric'})} from the household care log`);
  L.push(`Caregiver-reported observations, not a clinical record or a diagnosis.${out ? ' Parts marked (AI) were drafted by an AI assistant from the recorded notes. Please check them.' : ''}`);

  L.push('', out ? 'SUMMARY (AI)' : 'SUMMARY', '  ' + (out ? fix(out.summary) : localDoctorSummary(ds, es, inc)));

  L.push('', 'KEY NUMBERS (calculated by the app from every entry in the period)');
  if(es.length){
    L.push(`  - ${plural(es.length, 'check-in')} on ${plural(ds.length, 'day')}; average mood ${avg(es.map(e => e.mood)).toFixed(1)} of 5`,
      `  - Difficult days (average mood 2.5 or below): ${hard.length}${hard.length ? ` (${hard.length > 6 ? 'most recent: ' : ''}${hard.slice(-6).map(d => fmtShort(d.date)).join(', ')})` : ''}`,
      `  - Medications logged as given: ${pct(es.filter(e => e.meds).length, es.length)}% of check-ins; routine completed: ${pct(es.filter(e => e.routine).length, es.length)}%`,
      `  - Incidents logged: ${inc.length}${inc.length ? ` (serious ${sev(3)}, moderate ${sev(2)}, mild ${sev(1)})` : ''}`,
      `  - Most frequent triggers: ${tcs.ranked.length ? tcs.ranked.slice(0, 5).map(([t, n]) => `${t} (${n}x)`).join(', ') : 'none logged'}${tcs.fromNotes ? ' (includes mentions found in notes)' : ''}`);
    if(signed.signedInRange) L.push(`  - Dose sign-offs recorded in the app: ${signed.signedInRange} on ${plural(signed.daysWithSignoff, 'day')} (the tracker may not be used every day, so this is not a count of missed doses)`);
  } else L.push('  - No check-in entries in this period.');

  /* records the app flagged by keyword. if the ai part names an event on the same date that record is already covered so it isn't listed twice. */
  const covered = u => !!out && out.importantEvents.some(x => x.event.includes(u.date) || x.event.includes(fmtShort(u.date + 'T12:00:00')));
  const flagged = ctx.urgent.filter(u => !covered(u)).slice(0, 4);
  if(flagged.length) L.push('', 'FLAGGED RECORDS (found by keyword in the notes, not by AI; please check each one)', ...flagged.map(u => `  - ${fmtShort(u.date + 'T12:00:00')}${u.earlier ? ' (earlier)' : ''}, ${[u.src, ...(u.also || [])].map(x => x.toLowerCase()).join(' and ')}: ${fix(fitNote(u.text, 200).text)}`));
  if(out && out.importantEvents.length){
    L.push('', 'IMPORTANT EVENTS TO RAISE (AI; each needs checking)');
    out.importantEvents.forEach(x => { L.push('  - ' + fix(x.event)); if(x.followUp) L.push('    To check: ' + fix(x.followUp)); });
  }

  const rule = insights.filter(i => ['sleep', 'sched', 'both', 'wk', 'tod'].includes(i.id)).map(i => i.text);
  L.push('', out ? 'PATTERNS (AI)' : 'PATTERNS (calculated by the app)', ...(out ? bullets(out.patterns, 'none identified') : bullets(rule, 'No clear patterns yet.')));

  const worst = [...inc].sort((a, b) => b.severity - a.severity || new Date(b.ts) - new Date(a.ts)).slice(0, 4);
  L.push('', `INCIDENTS (most serious first; ${worst.length < inc.length ? `${worst.length} of ${inc.length}` : 'all'}, as written)`);
  if(worst.length) worst.forEach(e => L.push(`  - ${fmtShort(e.ts)} ${fmtTime(e.ts)}, severity ${e.severity}/3, ${e.byName}: ${fitNote(e.notes, 200).text || '(no note)'}`)); else L.push('  - none');

  const hands = careLogsR().filter(l => l.cat === 'handoff' && new Date(l.ts) >= startOfDay(from)).sort((a, b) => new Date(b.ts) - new Date(a.ts)).slice(0, 2);
  L.push('', 'LATEST HANDOFF NOTES (as written by caregivers)');
  if(hands.length) hands.forEach(l => L.push(`  - ${fmtShort(l.ts)}, ${l.byName}: ${fitNote(l.details, 240).text}`)); else L.push('  - none in this period');

  L.push('', 'ON FILE IN THE CARE PROFILE', `  Diagnoses: ${p.diagnoses.length ? p.diagnoses.join('; ') : 'none listed'}`, `  Medications: ${p.medications.length ? p.medications.map(m => `${m.name} ${m.dose}${m.time ? ' at ' + m.time : ''}`.trim()).join('; ') : 'none listed'}`,
    `  Known triggers: ${p.triggers.length ? p.triggers.join('; ') : 'none listed'}`, `  Comfort and sensory preferences: ${p.sensory.length ? p.sensory.join('; ') : 'none listed'}`);

  L.push('', out ? 'QUESTIONS TO ASK THE DOCTOR (AI; these are questions, not conclusions)' : 'QUESTIONS TO ASK THE DOCTOR', ...bullets(out ? out.questions : localDoctorQuestions(insights, es, ctx), 'none suggested'));

  const unclear = out ? [...out.uncertainties] : [];
  if(ds.length < range) unclear.push(`${plural(range - ds.length, 'day')} of the ${range} have no entries, so counts and averages cover only the ${plural(ds.length, 'day')} that do.`);
  if(es.length && !signed.signedInRange) unclear.push('The dose sign-off tracker was not used in this period, so medication numbers come only from the check-ins.');
  if(out && (ctx.meta.omitted || ctx.meta.shortened)) unclear.push(`The AI-drafted parts were written from a selection of the records (${ctx.meta.entries} of ${plural(es.length, 'entry', 'entries')}, some notes shortened). The numbers above use every entry.`);
  if(unclear.length) L.push('', 'UNCLEAR OR MISSING', ...bullets(unclear, 'none noted'));
  L.push('', 'YOUR OWN NOTES FOR THE VISIT', '  ');
  return L.join('\n');
}

/* (re)write the on-device text when this report was never written, or the records changed and nobody edited it. an exact match in the saved ai drafts is used if there is one */
function ensureDoctorText(d, ctx){
  const sig = sigOf(ctx);
  if(d.status === 'done' && (d.sig === sig || d.edited)) return;
  const c = docCache[docKey()], hit = !!c && c.sig === sig;
  d.text = buildDoctorText(hit ? c.out : null, ctx); d.ai = hit; d.at = hit ? c.at : new Date().toISOString(); d.sig = sig; d.status = 'done'; d.note = '';
}
function paintDoctor(){
  const el = $('#doctor-card'); if(!el || route().name !== 'patterns') return;
  el.outerHTML = doctorCard(careContext());
}
async function requestDoctor(opts = {}){
  const key = docKey(), d = (docs[key] ||= docIdle()), rid = R().id, auto = !!opts.auto;
  if(d.busy) return;
  const ctx = careContext(), sig = sigOf(ctx);
  if(ctxEmpty(ctx)) return;
  if(!auto) d.edited = false;                                    // pressing the button asks for a fresh report, and the text says it replaces edits
  const finish = patch => { Object.assign(d, patch, {busy:false}); paintDoctor(); };
  /* the ai part is a bonus. whatever goes wrong with it the caregiver keeps a correct on-device report plus a notice saying why the ai part is missing */
  const local = why => { d.failedSig = sig; if(!d.edited){ d.text = buildDoctorText(null, ctx); d.ai = false; d.sig = sig; d.at = new Date().toISOString(); d.status = 'done'; } finish({note:why}); };
  if(location.protocol === 'file:'){ if(!auto) local('The AI-written parts only work on the hosted version of CareThread, not when the file is opened directly.'); return; }
  if(navigator.onLine === false){ if(!auto) local('You appear to be offline, so the AI-written parts could not be added.'); return; }
  const mine = ++docSeq; d.seq = mine; d.busy = true; d.note = ''; ensureDoctorText(d, ctx); paintDoctor();
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 35000);
  try {
    const res = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({...ctx.payload, task:'doctor'}), signal:ctl.signal});
    let data = null; try { data = await res.json(); } catch {}
    if(d.seq !== mine) return;                                   // the starting data was restored while this was running
    if(res.ok && data && data.ok === true && validDoctor(data.doctor)){
      const out = {...data.doctor, importantEvents:data.doctor.importantEvents || []}, at = new Date().toISOString();
      docCache[key] = {sig, at, out}; saveDocCache();
      if(rid === R().id && sigOf(careContext()) !== sig){ d.busy = false; paintDoctor(); setTimeout(maybeAutoDoctor, 0); return; }   // the records changed while it was being written, the next update takes care of it
      finish({status:'done', text:buildDoctorText(out, ctx), ai:true, sig, at, note:'', edited:false, failedSig:null});
      if(!auto){ const t = $('#doctor-text'); if(t) t.focus({preventScroll:true}); }
    }
    else if(res.status === 404 || res.status === 405) local('The AI-written parts aren’t available in this copy of CareThread because the server part isn’t connected.');
    else local(data && data.error && isStr(data.error.message) && data.error.message ? data.error.message : 'The AI-written parts couldn’t be added right now.');
  } catch(e){
    if(d.seq === mine) local(e && e.name === 'AbortError' ? 'The AI service took too long to answer, so the AI-written parts were left out.' : 'Couldn’t reach the AI service, so the AI-written parts were left out.');
  } finally { clearTimeout(timer); }
}
/* after something changes, ask for the ai version once for these exact records. never while the caregiver has edited the text, while a request is running, or again for records that already failed (the button tries again). */
function maybeAutoDoctor(){
  if(route().name !== 'patterns' || !touchedR()) return;
  const d = curDoc(), ctx = careContext();
  if(ctxEmpty(ctx) || d.busy || d.edited) return;
  const sig = sigOf(ctx);
  if((d.ai && d.sig === sig) || d.failedSig === sig) return;
  const hit = docCache[docKey()]; if(hit && hit.sig === sig){ ensureDoctorText(d, ctx); paintDoctor(); return; }
  requestDoctor({auto:true});
}
function doctorCard(ctx){
  const p = prof(), d = curDoc(), empty = ctxEmpty(ctx), busy = d.busy;
  if(!empty) ensureDoctorText(d, ctx);
  const stale = !empty && d.status === 'done' && d.sig !== sigOf(ctx);
  let out;
  if(empty) out = `<div class="empty" style="margin-top:14px">Nothing has been recorded for ${esc(p.name)} in the last ${range} days yet, so there is nothing to put in a doctor report.</div>`;
  else out = `<div style="margin-top:14px">${d.ai ? '<span class="chip a">Partly drafted with AI from caregiver notes</span>' : '<span class="chip">Written on this device from the saved records</span>'} <span class="tiny muted">Made at ${esc(fmtTime(d.at))}</span>
      ${busy ? '<p class="tiny muted" id="doctor-status" role="status" style="margin-top:8px">Updating with AI from the latest records…</p>' : ''}
      ${d.note ? `<div class="nudge" id="doctor-status" tabindex="-1" role="alert" style="margin-top:10px"><span>${esc(d.note)} The report below is the on-device version. You can try again with the button above.</span></div>` : ''}
      ${stale ? '<div class="nudge" style="margin-top:10px" role="status"><span>Entries, notes or the care profile have changed since this was written. Your edits are kept. Press “Refresh with AI” to rebuild it from the latest records (that replaces this text).</span></div>' : ''}
      <label class="f" style="margin-top:12px" for="doctor-text">Review and edit before you copy, print or download it<small>This is the whole document. Change anything you like.</small></label>
      <textarea id="doctor-text" class="doctext" rows="22" spellcheck="true">${esc(d.text)}</textarea><pre class="printcopy" aria-hidden="true">${esc(d.text)}</pre>
      <div class="row" style="margin-top:12px"><button type="button" class="btn ghost small" data-act="copy-doctor">Copy</button><button type="button" class="btn ghost small" data-act="dl-doctor">Download .txt</button><button type="button" class="btn ghost small" data-act="print-doctor">Print</button></div></div>`;
  return `<div class="card" id="doctor-card" style="margin-top:18px"><div class="row" style="justify-content:space-between"><div style="flex:1;min-width:240px"><h2 style="margin:0">Doctor report</h2><p class="muted tiny">${esc(docSendsText(p))}</p></div><button class="btn amber" data-act="gen-doctor" ${busy || empty ? 'disabled' : ''} ${busy ? 'aria-busy="true"' : ''}>${busy ? 'Updating…' : d.ai ? 'Refresh with AI' : 'Write with AI'}</button></div>${out}</div>`;
}

/* records the app flagged by keyword from entries, handoff notes and care logs, so patterns shows the written notes and not just the tick boxes */
function flaggedCard(ctx){
  if(!ctx.urgent.length) return '';
  return `<div class="card" style="margin-top:18px"><h2>Flagged in notes and logs</h2><p class="muted tiny">Serious or still-open items found by keywords in entries, handoff notes and care logs from the last ${range} days. The app found these, not the AI. Please check each one.</p><div class="aibox" style="margin-top:10px">${urgentList(ctx, ctx.map)}</div></div>`;
}
function viewPatterns(){

  const sumN = w => w.days.reduce((a, d) => a + d.n, 0), span = w => `Week of ${fmtShort(w.start)} to ${fmtShort(w.end)}: `;

    (w, v) => span(w) + (v === null ? 'no entries' : `medications logged as given in ${v}% of ${plural(sumN(w), 'check-in')}`), '#3D7A5A', 100, 'Medication consistency by calendar week, percent of check-ins');
  const inc = weeklyBars(weeks, w => sumN(w) ? w.days.reduce((a, d) => a + d.incidents, 0) : null, v => String(v),
    (w, v) => span(w) + (v === null ? 'no entries' : `${plural(v, 'incident')} across ${plural(sumN(w), 'check-in')}`), '#C06A35', 0, 'Incidents logged per calendar week');
  const tcs = triggerCounts(ds), trig = tcs.ranked, tmax = trig.length ? trig[0][1] : 1;

    <div class="row" style="margin-top:12px" role="group" aria-label="Date range">${[7, 14, 28].map(r => `<button class="btn small ${r === range ? '' : 'ghost'}" data-act="set-range" data-r="${r}" aria-pressed="${r === range}">${r} days</button>`).join('')}</div></div>
  ${note ? `<div class="empty">${esc(note)}</div>` : `

  <div class="card" style="margin-top:18px"><h2>In plain words</h2>

  <div class="card" style="margin-top:18px"><h2>Mood over time</h2><p class="muted" style="margin-bottom:8px">Blue dots show ${esc(p.name)}’s average mood across each day’s check-ins. Red dots mark difficult days, when that average was 2.5 or below. The orange line is the 7-day trend: the average of the last seven days, which shows whether mood is improving, declining or holding steady.</p><div class="chartwrap">${lineChart(ds, range)}</div>
    <ul class="legend" aria-label="Chart key"><li><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="#2563C9"/></svg>Blue dots: Daily average mood</li><li><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="#C62F2F"/></svg>Red dots: Difficult days</li><li><svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true"><path d="M2 7h20" stroke="#E8751A" stroke-width="3" stroke-linecap="round"/></svg>Orange line: 7-day trend</li></ul>
    <p class="muted tiny" style="margin-top:8px">A day is marked difficult only when its recorded average mood is 2.5 or below.</p>
    <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;min-height:32px">View as a table</summary><div style="overflow-x:auto;max-height:260px"><table class="plain"><thead><tr><th>Date</th><th>Avg mood</th><th>Entries</th><th>Incidents</th></tr></thead><tbody>${[...ds].reverse().map(d => `<tr><td>${fmtShort(d.date)}</td><td>${d.avg.toFixed(1)}${isHard(d) ? ' (difficult)' : ''}</td><td>${d.n}</td><td>${d.incidents}</td></tr>`).join('')}</tbody></table></div></details></div>
  <div class="grid2" style="margin-top:18px;gap:18px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="card"><h2>Medication consistency</h2><div class="chartwrap">${wkly}</div></div>
    <div class="card"><h2>Incidents per week</h2><div class="chartwrap">${inc}</div></div>
  </div>
  <div class="card" style="margin-top:18px"><h2>Triggers logged</h2>${trig.length ? trig.map(([t, n]) => `<div class="hbar"><span>${esc(t)}</span><span class="bar" aria-hidden="true"><i style="width:${Math.round(100 * n / tmax)}%"></i></span><b>${n}</b></div>`).join('') : '<p class="muted">No triggers logged in this range.</p>'}
    ${tcs.fromNotes ? `<p class="muted tiny" style="margin-top:8px">Counts the triggers ticked on entries, plus ${plural(tcs.fromNotes, 'mention')} that a note describes but nobody ticked (${Object.entries(tcs.noted).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${t.toLowerCase()} ${n}`).join(', ')}).</p>` : ''}</div>`}
  ${doctorCard(ctx)}`;
}

        ${state.recipients.map(r => `<div class="member"><span class="avatar p" aria-hidden="true">${esc(initials(r.profile.name))}</span><span style="flex:1;min-width:120px"><b>${esc(r.profile.name)}</b>${r.profile.age ? `, ${esc(r.profile.age)}` : ''}<br><span class="muted tiny">${plural(state.entries.filter(e => e.rid === r.id).length, 'entry', 'entries')} logged</span></span>
          ${adm && state.recipients.length > 1 ? `<button class="btn danger small" data-act="remove-recipient" data-id="${r.id}" aria-label="Remove ${esc(r.profile.name)}">Remove</button>` : ''}</div>`).join('')}
        ${adm ? `<form id="addperson" class="row" style="margin-top:14px"><label class="sr" for="pname">Name</label><input id="pname" type="text" placeholder="Name" style="flex:1;min-width:140px" maxlength="30"><label class="sr" for="page">Age</label><input id="page" type="number" min="0" max="120" placeholder="Age" style="width:90px"><button class="btn small" type="submit">Add person</button></form>` : ''}</div>
      <div class="card"><h2>Reminders</h2>
        <label class="switch"><span><b>Medication check</b><br><span class="tiny muted">Nudge on Today if no meds are logged as given by 10 AM</span></span><input type="checkbox" data-act-change="rem" data-k="meds" ${state.reminders.meds ? 'checked' : ''}></label>
        <label class="switch"><span><b>Nothing logged yet</b><br><span class="tiny muted">Nudge on Today if there are no entries by 9 AM</span></span><input type="checkbox" data-act-change="rem" data-k="log" ${state.reminders.log ? 'checked' : ''}></label>
        <p class="tiny muted">Reminders appear inside the app.</p></div>
    </div>
    <div class="stack">
      <div class="card"><h2>Invite a caregiver</h2><p class="muted" style="margin-bottom:12px">Share this code so a new caregiver can join the circle.</p><span class="code" id="invcode">${esc(h.code)}</span>
        <div class="row" style="margin-top:12px"><button class="btn ghost small" data-act="copy-code">Copy</button>${adm ? '<button class="btn ghost small" data-act="regen-code">New code</button>' : ''}</div></div>
      <div class="card"><h2>Your data</h2>
        <div class="stack" style="gap:10px"><button class="btn ghost small" data-act="export-csv">Export all entries (CSV)</button>
        <button class="btn danger small" data-act="reset-data">Restore starting data</button></div>
        <p class="tiny muted" style="margin-top:10px">Everything is saved in this browser only. The optional AI reflection and doctor visit prompt on the Patterns screen send the chosen period’s entries, notes, handoff notes and care logs (names of the person, medications, conditions and doctors replaced by placeholders) only when you press their buttons. The “Today’s entries at a glance” summary is written by an AI service from today’s entries and their notes (the person’s name removed) each time an entry is added, edited or deleted; if the service can’t be reached, a built-in summary is shown instead. CareThread is a family logging tool, not a medical record or medical advice.</p></div>
    </div>
  </div>`;
}

/* === render + routing === */
const TITLES = {today:'Today', handoff:'Handoff', log:'Log an entry', patterns:'Patterns', profile:'Care profile', household:'Household'};
let editingProfile = false, lastView = null, pendingFocus = null;
/* which screen the person was on before the log screen so saving or cancelling puts them back there. starting a shift or posting a note never changes the screen. */
let curRoute = null, logOrigin = 'today', handoffOpen = false;
const logBack = () => { location.hash = '#/' + (NAV.some(n => n[0] === logOrigin) && logOrigin !== 'log' ? logOrigin : 'today'); };
function render(keepScroll){
  const r = route().name, root = $('#view');
  const viewId = r + '|' + R().id + '|' + (editId || '') + '|' + (editingProfile ? 'e' : '');
  const fresh = lastView !== viewId;
  const html = {today:viewToday, handoff:viewHandoff, log:viewLog, patterns:viewPatterns, profile:() => viewProfile(editingProfile), household:viewHousehold}[r]();
  const y = window.scrollY;
  root.innerHTML = html;
  document.title = `${TITLES[r]} · CareThread`;
  $('#sidenav').innerHTML = NAV.map(([k, l, h]) => `<a href="${h}" ${k === r ? 'aria-current="page"' : ''}>${ico(k)}<span>${l}</span></a>`).join('');
  const T = [['today','Today'], ['handoff','Handoff'], ['log','Log'], ['patterns','Patterns'], ['profile','Profile']];
  $('#tabs').innerHTML = T.map(([k, l]) => `<a href="#/${k}" class="${k === 'log' ? 'fab' : ''}" ${k === r ? 'aria-current="page"' : ''}>${k === 'log' ? `<span class="dot">${ico('log', 28)}</span><span>${l}</span>` : `${ico(k, 24)}<span>${l}</span>`}</a>`).join('');
  $('#whoami').innerHTML = `Signed in as <b>${esc(me().name)}</b> (${me().role})<br>${esc(state.household.name)}`;
  if(fresh){
    lastView = viewId; window.scrollTo(0, 0); root.focus({preventScroll:true});
    root.classList.remove('view-in'); void root.offsetWidth; root.classList.add('view-in');   // restart the short fade
  } else if(keepScroll) window.scrollTo(0, y);
  /* a redraw replaces the button that was just pressed so keyboard focus goes to the matching control */
  if(pendingFocus){ const el = $(pendingFocus); if(el) el.focus({preventScroll:true}); pendingFocus = null; }
  justPosted = false; freshIds.clear();     // the arrival animations only play once
  curRoute = r;
  clearTimeout(autoDocTimer); if(r === 'patterns') autoDocTimer = setTimeout(maybeAutoDoctor, 900);     // after a change the doctor report updates itself
}
window.addEventListener('hashchange', () => {
  const next = route().name;
  if(next === 'log' && curRoute && curRoute !== 'log') logOrigin = curRoute;
  editingProfile = false; handoffOpen = false; if(next !== 'log') editId = null; render();
});

let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }
async function copy(text, ok){
  try { await navigator.clipboard.writeText(text); toast(ok); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(ok); } catch { toast('Couldn’t copy. Select the text and copy it by hand.'); } ta.remove(); }
}
function download(name, text, type){ const b = new Blob([text], {type}), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); }

function csvCell(v){ let s = String(v ?? ''); if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function exportCSV(){
  const nameOf = id => (state.recipients.find(r => r.id === id) || {profile:{name:''}}).profile.name;
  const head = ['person','date','time','logged_by','mood','medications_given','routine_completed','behaviors','triggers','severity','notes'];
  const rows = [...state.entries].sort((a, b) => new Date(a.ts) - new Date(b.ts)).map(e => [nameOf(e.rid), dayKey(e.ts), fmtTime(e.ts), e.byName, e.mood, e.meds ? 'yes' : 'no', e.routine ? 'yes' : 'no', e.behaviors.join('; '), e.triggers.join('; '), e.severity, e.notes]);
  download(`carethread-entries-${todayKey()}.csv`, [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv');
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const np = ev.target.closest('.note-txt');
  if(np){ const open = np.classList.toggle('open'); np.setAttribute('aria-expanded', open); return; }
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'copy-summary'){ const n = noteR(); copy((n ? n.text + '\n\n' : '') + glanceView().text, 'Handoff note copied'); }
  else if(a === 'sign-dose') signOffDose(b.dataset.key);
  else if(a === 'undo-dose') undoDose(b.dataset.key);
  else if(a === 'start-shift') startShift();
  else if(a === 'end-shift') endShift();
  else if(a === 'takeover-shift') takeOverShift();
  else if(a === 'open-history') openHistory();
  else if(a === 'dismiss-shift-done'){ justEnded = null; handoffOpen = false; render(true); }
  else if(a === 'focus-handoff'){ handoffOpen = true; pendingFocus = '#handoff-input'; render(true); const f = $('#handoff-input'); if(f) f.scrollIntoView({behavior:reducedMotion() ? 'auto' : 'smooth', block:'center'}); }
  else if(a === 'edit-entry'){ editId = b.dataset.id; location.hash = '#/log'; if(route().name === 'log') render(); }
  else if(a === 'delete-entry'){ const e = state.entries.find(x => x.id === b.dataset.id); if(e && canEdit(e) && confirm(`Delete ${e.byName}’s entry from ${fmtTime(e.ts)}? This can’t be undone.`)){ state.entries = state.entries.filter(x => x.id !== e.id); markChanged(e.rid); save(); render(true); toast('Entry deleted'); scheduleGlance(); } }
  else if(a === 'set-range'){ range = +b.dataset.r; render(true); }
  else if(a === 'retry-glance') refreshGlance();
  else if(a === 'gen-ai') requestAiReflection();
  else if(a === 'gen-doctor') requestDoctor();
  else if(a === 'copy-doctor') copy(curDoc().text, 'Doctor report copied');
  else if(a === 'print-doctor') window.print();
  else if(a === 'dl-doctor') download(`doctor-report-${prof().name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'care'}-${todayKey()}.txt`, curDoc().text, 'text/plain');
  else if(a === 'edit-profile'){ editingProfile = true; render(); }
  else if(a === 'cancel-profile'){ editingProfile = false; render(); }
  else if(a === 'copy-code') copy(state.household.code, 'Invite code copied');
  else if(a === 'regen-code'){ if(isAdmin()){ state.household.code = 'CARE-' + String(Math.floor(1000 + Math.random() * 9000)); save(); render(true); toast('New invite code created'); } }
  else if(a === 'remove-member'){ if(isAdmin() && confirm('Remove this person from the care circle? Their past entries stay.')){ state.household.members = state.household.members.filter(m => m.id !== b.dataset.id); save(); render(true); } }
  else if(a === 'remove-recipient'){
    const r = state.recipients.find(x => x.id === b.dataset.id);
    if(isAdmin() && r && state.recipients.length > 1 && confirm(`Remove ${r.profile.name} and all of their entries? This can’t be undone.`)){
      state.recipients = state.recipients.filter(x => x.id !== r.id); state.entries = state.entries.filter(e => e.rid !== r.id);
      delete state.carelogs[r.id]; delete state.notes[r.id]; delete state.doses[r.id]; delete state.shifts[r.id]; state.shiftLog = state.shiftLog.filter(x => x.rid !== r.id);
      if(state.rid === r.id) state.rid = state.recipients[0].id; save(); render(true);
    }
  }
  else if(a === 'export-csv') exportCSV();
  else if(a === 'reset-data'){ if(confirm('Replace everything with the starting data? Entries, notes and sign-offs you added will be lost.')){ const keep = state.me; state = seedState(); state.me = keep; handoffDraft = ''; editId = null; editingProfile = false; ai = aiIdle(); aiSeq++; Object.keys(docs).forEach(k => delete docs[k]); docSeq++; docCache = {}; store.del(DOC_KEY); handoffOpen = false; justEnded = null; glanceCache = {}; store.del(GLANCE_KEY); glanceFailed = false; save(); lastView = null; render(true); toast('Starting data restored'); } }
});
document.addEventListener('keydown', ev => {
  if((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('note-txt')){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id === 'rsel'){ state.rid = t.value; save(); editingProfile = false; render(); }
  else if(t.id === 'meselect'){ state.me = t.value; save(); editingProfile = false; render(true); toast(`Now signed in as ${me().name}`); }
  else if(t.dataset.actChange === 'role' && isAdmin()){
    const m = state.household.members.find(x => x.id === t.dataset.id);
    if(m){ if(m.role === 'admin' && t.value === 'caregiver' && state.household.members.filter(x => x.role === 'admin').length <= 1){ toast('There has to be at least one admin.'); render(true); return; } m.role = t.value; save(); render(true); }
  }
  else if(t.dataset.actChange === 'rem'){ state.reminders[t.dataset.k] = t.checked; save(); }
});
document.addEventListener('submit', ev => {
  const f = ev.target;
  if(f.id === 'logform'){
    ev.preventDefault();
    const fd = new FormData(f), mood = +fd.get('mood');
    if(!mood){ $('#moderr').textContent = 'Pick a mood first. It’s the one required answer.'; $('#moderr').scrollIntoView({block:'center'}); return; }
    const [hh, mm] = String(fd.get('time') || '').split(':').map(Number);
    const fields = {mood, meds:fd.get('meds') === 'yes', routine:fd.get('routine') === 'yes', behaviors:fd.getAll('beh'), triggers:fd.getAll('trig'), severity:+fd.get('sev') || 0, notes:String(fd.get('notes') || '').trim()};
    const ed = editId ? state.entries.find(e => e.id === editId) : null;
    const when = ed ? new Date(ed.ts) : new Date();
    if(Number.isFinite(hh) && Number.isFinite(mm)) when.setHours(hh, mm, 0, 0);
    if(ed){ Object.assign(ed, fields, {ts:when.toISOString()}); editId = null; toast('Entry updated'); }
    else {
      if(when.getTime() > Date.now() + 60000) when.setDate(when.getDate() - 1);   // a time "later today" that hasn't happened yet can only mean yesterday
      state.entries.push(Object.assign({id:uid('e'), rid:R().id, ts:when.toISOString(), by:me().id, byName:me().name}, fields, shiftTag(when)));
      toast('Entry saved.');
    }
    markChanged(ed ? ed.rid : R().id); save(); logBack(); scheduleGlance();
  }
  else if(f.id === 'profform'){
    ev.preventDefault();
    if(!isAdmin()){ toast('Only admins can edit the profile.'); return; }
    const fd = new FormData(f), lines = k => String(fd.get(k) || '').split('\n').map(s => s.trim()).filter(Boolean);
    const split = l => l.split('|').map(s => s.trim());
    R().profile = {
      name:String(fd.get('name') || '').trim() || prof().name, age:fd.get('age') === '' ? '' : +fd.get('age'),
      diagnoses:lines('diagnoses'), triggers:lines('triggers'), sensory:lines('sensory'), emergency:String(fd.get('emergency') || '').trim(),
      medications:lines('medications').map(split).map(([name, dose = '', when = '', time = '']) => ({name, dose, when, time})),
      doctors:lines('doctors').map(split).map(([name, role = '', phone = '']) => ({name, role, phone}))
    };
    markChanged(); save(); editingProfile = false; render(); toast('Profile saved');
  }
  else if(f.id === 'handoffform'){ window.submitNewHandoff(ev); }
  else if(f.id === 'addmember'){
    ev.preventDefault();
    const n = $('#newname').value.trim(); if(!n || !isAdmin()) return;
    state.household.members.push({id:uid('u'), name:n, role:'caregiver'}); save(); render(true); toast(`${n} joined the care circle`);
  }
  else if(f.id === 'addperson'){
    ev.preventDefault();
    const n = $('#pname').value.trim(), age = $('#page').value; if(!n || !isAdmin()) return;
    const r = {id:uid('r'), profile:{name:n, age:age === '' ? '' : +age, diagnoses:[], medications:[], triggers:[], sensory:[], doctors:[], emergency:''}};
    state.recipients.push(r); state.carelogs[r.id] = []; state.rid = r.id; save(); location.hash = '#/profile'; toast(`${n} added. Tap Edit profile to fill in their details.`);
  }
});

/*
   ---------- care log actions ----------
   every action does the same loop: change the state, save it, redraw from it. that's why a refresh always shows exactly what was on screen.
*/
const reducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const attrValue = v => String(v).replace(/["\\]/g, '\\$&');

/*
   post a new handoff note. it becomes the active note on today and a new entry on the care timeline right away.
   connected to the form on the handoff screen, and can also be called from the browser console while recording:
     submitnewhandoff('calm afternoon. evening medication is due at 8.')
*/
window.submitNewHandoff = function submitNewHandoff(input){
  const field = $('#handoff-input'), err = $('#handoff-error');
  const fromEvent = isObj(input) && typeof input.preventDefault === 'function';
  if(fromEvent) input.preventDefault();                       // stops the form from reloading the page
  if(!fromEvent && typeof input !== 'string' && !field){ toast('End your shift on the Handoff screen to leave a note for the next caregiver.'); return null; }
  const text = String(typeof input === 'string' ? input : field.value).trim();

  /* 1. check the text */
  if(!text){ if(err) err.textContent = 'Write a few words for the next caregiver first.'; if(field) field.focus(); else toast('The note is empty.'); return null; }
  if(text.length > MAX_HANDOFF){ if(err) err.textContent = `Please keep the note under ${MAX_HANDOFF} characters.`; if(field) field.focus(); else toast(`Keep the note under ${MAX_HANDOFF} characters.`); return null; }
  if(err) err.textContent = '';

  /* 2. add it to the timeline and make it the active note */
  const at = new Date().toISOString(), who = me();
  const log = {id:uid('l'), ts:at, cat:'handoff', title:`Handoff from ${who.name}`, details:text, highlights:[], by:who.id, byName:who.name};
  careLogsR().push(log);
  state.notes[R().id] = {text, by:who.id, byName:who.name, ts:at, highlights:[], logId:log.id};
  freshIds.add(log.id); justPosted = true; handoffDraft = ''; handoffOpen = false; justEnded = null; markChanged();

  /* 3. save, 4. redraw */
  save(); render(true);
  toast(`Handoff note posted for ${prof().name}. The next caregiver will see it first.`);
  const card = $('#active-note-card');
  if(card && card.getBoundingClientRect().top < 0) card.scrollIntoView({behavior:reducedMotion() ? 'auto' : 'smooth', block:'center'});
  return log;
};

/* pending -> taken. records who signed and when, and adds a "sign-off" entry to the care timeline. */
function signOffDose(key){
  const m = prof().medications.find(x => medKey(x) === key), d = dosesR();
  if(!m || d.done[key]) return;                               // ignore double taps
  const at = new Date().toISOString(), who = me();
  const log = {id:uid('l'), ts:at, cat:'signoff', title:`${m.name} given`, details:`${who.name} signed off ${m.name} ${m.dose}${m.time ? ', scheduled for ' + m.time : ''}.`, highlights:[], by:who.id, byName:who.name};
  careLogsR().push(log);
  d.done[key] = {by:who.id, byName:who.name, at, logId:log.id};
  freshIds.add(log.id); markChanged();
  pendingFocus = `[data-act="undo-dose"][data-key="${attrValue(key)}"]`;
  save(); render(true);
  toast(`${m.name} signed off by ${who.name}.`);
}
/* undo a mis-tap: the dose goes back to pending and the timeline entry it made is removed so the record stays honest. */
function undoDose(key){
  const d = dosesR(), rec = d.done[key], m = prof().medications.find(x => medKey(x) === key);
  if(!rec || !canUndoDose(rec)) return;
  if(rec.logId) state.carelogs[R().id] = careLogsR().filter(l => l.id !== rec.logId);
  delete d.done[key]; markChanged();
  pendingFocus = `[data-act="sign-dose"][data-key="${attrValue(key)}"]`;
  save(); render(true);
  toast(`${m ? m.name : 'Dose'} set back to pending.`);
}

/* the handoff box: remember the draft so a redraw never loses it, keep the counter live, ctrl/cmd+enter posts */
document.addEventListener('input', ev => {
  if(ev.target.id === 'doctor-text'){ const d = curDoc(); d.text = ev.target.value; d.edited = true; const pc = $('.printcopy'); if(pc) pc.textContent = d.text; return; }          // keep every edit so a redraw never loses it
  if(ev.target.id !== 'handoff-input') return;
  handoffDraft = ev.target.value;
  const c = $('#handoff-counter'); if(c) c.textContent = `${handoffDraft.length} / ${MAX_HANDOFF}`;
  const e = $('#handoff-error'); if(e && e.textContent) e.textContent = '';
});
document.addEventListener('keydown', ev => {
  if(ev.target.id === 'handoff-input' && ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) window.submitNewHandoff(ev);
});

/* keeping the app honest over time */
document.addEventListener('visibilitychange', () => {                // a tab left open overnight starts a fresh medication day
  if(document.visibilityState === 'visible' && rollDoses()){ save(); render(true); toast('New day: medications are back to pending.'); }
});
window.addEventListener('storage', ev => {                           // the app open in two tabs: a change in one shows up in the other
  if(ev.key === KEY){ const next = loadState(); if(next){ state = next; render(true); } }
});

render();
})();
</script>
