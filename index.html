<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A6B7C">
<meta name="description" content="CareThread: a shared care log and handoff tool for families caring for someone together.">
<title>CareThread — shared care, no dropped stitches</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%232A6B7C'/%3E%3Cpath d='M30.8 29.4C26.8 31.4 23.6 30.8 20 28.6C11.5 23.6 9.2 17.6 12.6 14C15.4 11.2 19 12.4 20 15.6C21 12.4 24.6 11.2 27.4 14C30.8 17.6 28.5 23.6 20 28.6' fill='none' stroke='%23FFF7E4' stroke-width='2.7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='30.8' cy='29.4' r='2.4' fill='%23D4874E'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F7F5F2; --card:#FFFDF9; --ink:#1A1F2E; --teal:#2A6B7C; --teal-deep:#1F5260;
  --amber:#D4874E; --amber-ink:#8A4A17; --green:#3D7A5A; --muted:#5C636E; --line:#E3DCD0;
  --cream:#FFF7E4; --brick:#9B3B2E;
  /* fonts: fraunces and figtree if they are installed on the device, if not it uses normal system fonts. nothing to download so the app works offline */
  --display:'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --radius:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--body);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .28  0 0 0 .055 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.65rem,4.5vw,2.35rem)}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{top:10px}

/* ---------- page change: a short quiet fade ---------- */
@keyframes viewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.view-in{animation:viewIn .22s cubic-bezier(.2,.7,.3,1) both}

/* ---------- shell ---------- */
.shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.shell>div{min-width:0}   /* lets the page column shrink to the screen so a wide chart scrolls inside its card and doesn't make the whole page wider */
.side-nav{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;padding-top:max(14px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.02em;margin-top:-3px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);text-decoration:none;transition:background .15s}
.iconbtn:hover{background:#EFE9DF}
.main{padding:8px 18px 130px;max-width:1080px;width:100%;margin:0 auto}
.main:focus{outline:none}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:600;border-radius:14px;transition:background .18s,color .18s}
.tabs a[aria-current="page"]{color:var(--teal);background:#E6F0F2}
.tabs a.fab{position:relative}
.tabs a.fab span.dot{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--amber);color:var(--ink);margin-top:-30px;border:4px solid var(--card);box-shadow:0 6px 14px rgba(138,74,23,.28)}
.tabs a.fab[aria-current="page"]{background:none}

@media(min-width:900px){
  .shell{grid-template-columns:250px minmax(0,1fr)}
  .topbar{display:none}
  .tabs{display:none}
  .side-nav{display:flex;flex-direction:column;gap:6px;padding:26px 18px;position:sticky;top:0;height:100vh;border-right:1.5px solid var(--line);background:rgba(255,253,249,.7)}
  .side-nav nav{display:flex;flex-direction:column;gap:4px;margin-top:26px}
  .side-nav nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;text-decoration:none;color:var(--ink);font-weight:600;min-height:48px;transition:background .18s,color .18s}
  .side-nav nav a:hover{background:#EFE9DF}
  .side-nav nav a[aria-current="page"]{background:var(--teal);color:#fff}
  .side-nav .whoami{margin-top:auto;font-size:.85rem;color:var(--muted);border-top:1.5px dashed var(--line);padding-top:14px}
  .main{padding:34px 40px 60px}
}

/* ---------- pieces ---------- */
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--amber-ink)}
.lede{color:var(--muted);margin-top:6px;max-width:60ch}
.pagehead{margin:10px 0 22px}
.grid2{display:grid;gap:22px}
@media(min-width:900px){.grid2{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card h2{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s,transform .1s}
.btn:hover{background:var(--teal-deep)}
.btn:active{transform:translateY(1px)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.btn.amber:hover{background:#C97A41}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.ghost:hover{background:#E6F0F2}
.btn.danger{background:transparent;border-color:var(--brick);color:var(--brick)}
.btn.danger:hover{background:#F6E3DE}
.btn.small{min-height:40px;padding:0 14px;font-size:.92rem}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)}
.tiny{font-size:.82rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:#EFE9DF;font-size:.84rem;font-weight:600}
.chip.t{background:#E6F0F2;color:var(--teal-deep)}
.chip.a{background:#FBE9D8;color:var(--amber-ink)}
.rbar{display:flex;align-items:center;gap:10px;margin:8px 0 2px;flex-wrap:wrap}
.rbar label{font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em}
.rbar select{width:auto;min-width:170px;font-weight:700}

/* today layout. note + thread on the left, glance cards on the right. on a phone the stats go right under the note */
.tgrid{display:grid;gap:22px}
.tgrid .a{order:1}.tgrid .side{display:contents}.tgrid .b{order:2}.tgrid .c{order:3}.tgrid .d{order:4}
@media(min-width:900px){
  .tgrid{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
  .tgrid .a{grid-column:1;grid-row:1}.tgrid .c{grid-column:1;grid-row:2}
  .tgrid .side{display:grid;gap:22px;grid-column:2;grid-row:1 / span 2;align-content:start}
}

/* handoff note */
.note{position:relative;background:var(--cream);border:2px dashed rgba(212,135,78,.7);border-radius:14px;padding:28px 24px 20px;transform:rotate(-.35deg);box-shadow:0 10px 24px -14px rgba(138,74,23,.45)}
.note::before{content:"";position:absolute;top:-13px;left:26px;width:92px;height:26px;background:rgba(212,135,78,.38);transform:rotate(-3deg);border-radius:3px}
.note .tag{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--amber-ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note p.body{font-family:var(--display);font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.5;margin-top:10px;font-weight:500}
.note.big p.body{font-size:clamp(1.3rem,3.2vw,1.65rem)}
.note .foot{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,#F0E6CB 25%,#F8EFD6 50%,#F0E6CB 75%);background-size:200% 100%;animation:sh 1.3s infinite;margin-top:12px}
@keyframes sh{to{background-position:-200% 0}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat .k{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:clamp(1.1rem,4.6vw,1.5rem);font-weight:700;margin-top:2px;white-space:nowrap}
.stat .s{font-size:.8rem;color:var(--muted)}
.stat.ok .v{color:var(--green)} .stat.warn .v{color:var(--brick)}

.nudge{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#FBE9D8;border:1.5px solid #EBC49E;color:#5A2E0B}

/* timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;border-left:2.5px dashed var(--amber);opacity:.6}
.timeline li{position:relative;padding-left:56px;margin-bottom:14px}
.timeline .node{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--card);border:2.5px solid var(--c);display:grid;place-items:center;color:var(--c)}
.entry{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.entry header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}
.entry .who{font-weight:700}
.entry .when{color:var(--muted);font-size:.86rem}
.mood{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:.84rem;font-weight:700;background:var(--bg);color:var(--c)}
.entry .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.entry .tags .chip{font-size:.78rem;padding:2px 9px}
.entry .tags .chip.warn{background:#F6E3DE;color:var(--brick)}
.entry p.note-txt{margin-top:8px;color:#2E3445;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.entry p.note-txt.open{display:block;-webkit-line-clamp:unset}
.entry .eactions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.linkbtn{background:none;border:0;color:var(--teal);font-weight:700;font-size:.86rem;cursor:pointer;min-height:36px;padding:0 10px;border-radius:10px}
.linkbtn:hover{background:#E6F0F2}
.linkbtn.d{color:var(--brick)} .linkbtn.d:hover{background:#F6E3DE}
.empty{padding:26px;text-align:center;border:2px dashed var(--line);border-radius:var(--radius);color:var(--muted)}

/* form */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;margin-bottom:8px;padding:0}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods label{cursor:pointer}
.moods input{position:absolute;opacity:0;pointer-events:none}
.moods .tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:16px;border:2px solid var(--line);background:var(--card);min-height:92px;color:var(--c);text-align:center;transition:background .15s,border-color .15s}
.moods .tile b{font-size:.76rem;color:var(--ink);line-height:1.15}
.moods .tile i{font-style:normal;font-family:var(--display);font-weight:700;font-size:.95rem}
.moods input:checked + .tile{background:var(--bg);border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.moods input:focus-visible + .tile{outline:3px solid var(--amber);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;font-weight:700;transition:background .15s,color .15s}
.seg input:checked + span{background:var(--teal);color:#fff}
.seg input:focus-visible + span{outline:3px solid var(--amber);outline-offset:-3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:600;transition:background .15s,border-color .15s}
.chips input:checked + span{background:#E6F0F2;border-color:var(--teal);color:var(--teal-deep)}
.chips input:checked + span::before{content:"✓"}
.chips.trig input:checked + span{background:#FBE9D8;border-color:var(--amber);color:var(--amber-ink)}
.chips input:focus-visible + span{outline:3px solid var(--amber);outline-offset:2px}
textarea,input[type=text],input[type=time],input[type=number],input[type=password],select{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card)}
textarea{min-height:110px;resize:vertical}
label.f{display:grid;gap:6px;font-weight:700}
label.f small{font-weight:400;color:var(--muted)}
.err{color:var(--brick);font-weight:600;min-height:1.4em}

/* charts */
.chartwrap{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block;min-width:420px}
.insights{display:grid;gap:14px}
@media(min-width:700px){.insights{grid-template-columns:1fr 1fr}}
.insight{background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:6px;align-content:start}
.insight .big{font-family:var(--display);font-size:2.1rem;font-weight:700;color:var(--teal);line-height:1}
.insight .basis{font-size:.8rem;color:var(--muted)}
.badge{justify-self:start;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:#EFE9DF}
.badge.strong{background:#DCEFE4;color:#1F5B3C}.badge.mod{background:#FBE9D8;color:var(--amber-ink)}
.hbar{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}
.hbar .bar{height:14px;border-radius:99px;background:#EFE9DF;overflow:hidden}
.hbar .bar i{display:block;height:100%;background:var(--amber);border-radius:99px}
pre.printcopy{display:none}
table.plain{width:100%;border-collapse:collapse;font-size:.92rem}
table.plain th,table.plain td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line)}
ul.clean{margin:0;padding-left:1.1rem;display:grid;gap:4px}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1.5px dashed var(--line);flex-wrap:wrap}
.member:last-child{border:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--teal);color:#fff;flex:none}
.avatar.p{background:var(--amber);color:var(--ink)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;letter-spacing:.14em;font-weight:700;background:#fff;border:2px dashed var(--amber);border-radius:14px;padding:10px 16px;display:inline-block}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;min-height:48px}
.switch input{width:26px;height:26px;accent-color:var(--teal)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:900px){.toast{bottom:28px}}

/* ---------- added with the care log part: handoff note extras, medication tracker, care timeline ---------- */
/* where the two new blocks go on today (medications under the stats on a phone, care timeline last and full width on a desktop) */
.tgrid .m{order:2}.tgrid .e{order:5}
@media(min-width:900px){.tgrid .e{grid-column:1 / -1;grid-row:3}}

.note p.body{white-space:pre-wrap;overflow-wrap:anywhere}
.note.settle{animation:noteSettle .45s cubic-bezier(.2,.7,.3,1) both}
@keyframes noteSettle{from{opacity:0;transform:translateY(10px) rotate(-1.2deg)}to{opacity:1;transform:translateY(0) rotate(-.35deg)}}
.note .autosum{margin-top:14px;padding-top:12px;border-top:1.5px dashed rgba(212,135,78,.55)}
.note .autosum p{font-size:.97rem}

progress.medbar{width:100%;height:12px;border:0;border-radius:99px;overflow:hidden;background:#EFE9DF;appearance:none;-webkit-appearance:none}
progress.medbar::-webkit-progress-bar{background:#EFE9DF;border-radius:99px}
progress.medbar::-webkit-progress-value{background:var(--green);border-radius:99px;transition:width .3s ease}
progress.medbar::-moz-progress-bar{background:var(--green);border-radius:99px}
.medtext{margin:8px 0 14px;color:var(--muted);font-size:.92rem}
.medlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.medrow{display:grid;gap:10px;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:#fff;transition:border-color .2s,background .2s}
.medrow[data-status="taken"]{background:#F3FAF6;border-color:#BFDCCB}
.medname{font-weight:700;font-size:1.05rem}
.meddetail{color:var(--muted);font-size:.9rem}
.medaction{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* the state button always shows a word ("pending" or "taken"), never just a color */
.statebtn{min-height:46px;min-width:124px;padding:0 18px;border-radius:99px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--amber);background:#FBE9D8;color:var(--amber-ink);transition:background .15s,transform .1s}
.statebtn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--amber)}
.statebtn:hover:not([disabled]){background:#F6DABE}
.statebtn:active:not([disabled]){transform:translateY(1px)}
.statebtn[data-status="taken"]{border-color:var(--green);background:var(--green);color:#fff;cursor:default}
.statebtn[data-status="taken"]::before{content:"\2713";width:auto;height:auto;background:none;font-size:1rem}
.signline{font-family:var(--display);font-style:italic;color:#1F5B3C;font-size:.98rem}

.timeline .node.glyph{font-family:var(--display);font-weight:700;font-size:1rem}
.entry h3{margin-top:8px}
.entry .details{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;color:#2E3445}
.timeline li.is-new .entry{animation:itemArrive .4s ease both}
@keyframes itemArrive{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
/* ---------- optional ai reflection on the patterns screen ---------- */
.aibox{margin-top:14px;padding:16px;border-radius:14px;background:#fff;border:1.5px solid var(--line)}
.aibox:focus{outline:none}
.aibox p+p,.aibox p+ul,.aibox ul+p{margin-top:10px}
.aibox h3{margin:14px 0 6px}
/* ---------- ai results: important events, doctor prompt ---------- */
.aibox .events li{list-style:none;padding:9px 12px;margin-bottom:8px;border-left:4px solid var(--amber);background:#FFF7E4;border-radius:8px}
.aibox .events span{color:var(--muted);font-size:.92rem}
.doctext{width:100%;margin-top:8px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:.9rem/1.55 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
/* ---------- mood chart legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 22px;list-style:none;margin:12px 0 0;padding:0;font-size:.92rem}
.legend li{display:flex;align-items:center;gap:8px}
/* ---------- shifts (handoff screen) ---------- */
.live{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--green)}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--green)}

/*
   carethread: a care coordination app.
   everything runs in this browser and saves to localstorage. the only things that can leave the device go to this site's own /api/care-insights: the optional ai reflection and the doctor visit prompt on the patterns screen (only when you press their buttons, both made by carecontext()) and the ai written "today's entries at a glance" (when today's entries change, see glancepayload()).
   
   order of this file:
     1. helpers and word lists
     2. starting data (2 people, 4 weeks of check-ins, 5 care logs each)
     3. state, checking, and saving/loading localstorage
     4. pattern analysis and charts
     5. the 6 screens (today, handoff, log, patterns, profile, household)
     6. render, routing and event handlers (every action: change state, save, redraw)

(() => {
'use strict';

/* === small helpers === */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const pad = n => String(n).padStart(2, '0');
const dayKey = d => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmtTime = d => new Date(d).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtShort = d => new Date(d).toLocaleDateString([], {month:'short', day:'numeric'});
const fmtLong = d => new Date(d).toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const pct = (n, d) => d ? Math.round(100 * n / d) : 0;
const plural = (n, w, p) => `${n} ${n === 1 ? w : (p || w + 's')}`;
const initials = n => (n || '?').trim().charAt(0).toUpperCase();

/* calendar day math, always in the viewer's own time zone */
const MS_DAY = 86400000;
const startOfDay = d => { const c = new Date(d); c.setHours(0, 0, 0, 0); return c; };
const daysBetween = (a, b) => Math.round((startOfDay(b) - startOfDay(a)) / MS_DAY);   // rounding handles daylight saving
/* "today", "yesterday", "1 week ago", "4 weeks ago", the little badge on the care timeline */
const relDay = ts => { const n = daysBetween(ts, new Date()); if(n <= 0) return 'Today'; if(n === 1) return 'Yesterday'; const w = Math.ceil(n / 7); return w === 1 ? '1 week ago' : w + ' weeks ago'; };
/* "8:00 pm" -> minutes after midnight (null if it can't be read) */
const timeToMinutes = t => { const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(String(t || '')); if(!m) return null; let h = +m[1] % 12; if(/pm/i.test(m[3])) h += 12; return h * 60 + +m[2]; };

  get(k){ try { const v = localStorage.getItem(k); if(v !== null) return v; } catch {} return mem[k] ?? null; },
  set(k, v){ mem[k] = v; try { localStorage.setItem(k, v); } catch {} },

/*

*/
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

});

const GEN = {

function genHistory(rid, P){
  const rnd = mulberry32(P.seed), pick = a => a[Math.floor(rnd() * a.length)];
  const out = [], today = new Date(); today.setHours(0, 0, 0, 0);
  const era = P.era ? {medChange:buildPastDate(9, 15, 9).getTime(), nutrition:buildPastDate(9, 22, 18).getTime()} : null;   // dates from the care timeline
  for(let i = 27; i >= 1; i--){
    const date = new Date(today); date.setDate(date.getDate() - i);
    const dow = date.getDay(), we = dow === 0 || dow === 6;
    const sleepBad = rnd() < P.sleepP, sched = rnd() < (we ? P.schedWe : P.schedWk), noise = rnd() < P.noiseP, medical = rnd() < P.medicalP;
    const base = P.base + (we ? P.wkBonus : 0) - P.sleepW * sleepBad - P.schedW * sched - P.noiseW * noise - P.medicalW * medical;
    const bad = sleepBad || sched || medical;
    const n = rnd() < P.threeP ? 3 : 2;
    const slots = [[8, 10 + Math.floor(rnd() * 30), P.authors[0]], [15, 20 + Math.floor(rnd() * 35), P.authors[1]], [19, 40 + Math.floor(rnd() * 15), rnd() < P.altEve ? P.altAuthor : P.authors[2]]].slice(0, n);
    slots.forEach(([h, m, by], idx) => {
      const eraAdj = era ? (idx === 0 && date.getTime() < era.medChange ? -0.4 : idx === 1 && date.getTime() >= era.nutrition ? 0.4 : 0) : 0;   // drowsy mornings before the medication change, brighter afternoons after the nutrition targets
      const mood = clamp(Math.round(base - (idx === 2 ? P.eveningDip : 0) + eraAdj + (rnd() - 0.5) * 1.3), 1, 5);
      const trig = [];
      if(sleepBad && idx === 0) trig.push('Sleep disruption');
      if(sched && (idx === 1 || (idx === 0 && rnd() < 0.4))) trig.push('Schedule change');
      if(noise && idx === 1) trig.push('Noise');
      if(medical && idx <= 1) trig.push('Medical');
      if(rnd() < 0.04) trig.push(pick(['Dietary change', 'Social interaction']));
      let beh;
      if(mood <= 2) beh = [pick(P.low)]; else if(mood === 3) beh = [pick(P.mid)]; else beh = [pick(['Calm', 'Happy'])];
      if(mood === 5) beh = ['Happy', 'Calm'];
      let note;
      if(trig.includes('Sleep disruption')) note = pick(P.N.sleep);
      else if(trig.includes('Schedule change')) note = pick(P.N.sched);
      else if(trig.includes('Noise')) note = pick(P.N.noise);
      else if(P.N.social && trig.includes('Social interaction')) note = pick(P.N.social);
      else if(P.N.diet && trig.includes('Dietary change')) note = pick(P.N.diet);
      else if(trig.includes('Medical') && P.N.medical.length) note = pick(P.N.medical);
      else if(P.N.drowsy && era && idx === 0 && mood <= 3 && date.getTime() < era.medChange) note = pick(P.N.drowsy);
      else if(idx === 2 && mood <= 3 && P.N.sundown.length) note = pick(P.N.sundown);
      else note = mood >= 4 ? pick(P.N.good) : pick(P.N.ok);
      const rm = rnd() < P.medsP[idx];
      /* missed doses only happen on the dates the care timeline talks about (p.missed), never random, so every flagged record has a story behind it */
      const forced = (P.missed || []).find(x => x.idx === idx && date.getMonth() === x.m && date.getDate() === x.d);
      const meds = forced ? false : (P.onlyForced ? true : rm);
      if(forced) note = forced.note;
      const routine = rnd() < (bad ? 0.55 : 0.95);
      const severity = mood <= 2 ? (rnd() < (P.sev2 ?? 0.5) ? 2 : (P.sevTop ?? 3)) : (mood === 3 && trig.length && rnd() < 0.35 ? 1 : 0);
      const d = new Date(date); d.setHours(h, m, 0, 0);
      out.push({id:uid('e'), rid, ts:d.toISOString(), by:by.id, byName:by.name, mood, meds, routine, behaviors:beh, triggers:trig, notes:note, severity});
    });
  }
  return out;
}
/* today's entries are placed relative to the current time so they are never in the future */
function genToday(rid, specs){
  const now = new Date(), midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const floor = midnight.getTime() + 5 * 60000;
  return specs.map(([minsAgo, order, by, f]) => Object.assign({id:uid('e'), rid, ts:new Date(Math.max(now.getTime() - minsAgo * 60000, floor + order * 12 * 60000)).toISOString(), by:by.id, byName:by.name, severity:0}, f));
}

/*
   ---------- the 5 care logs for each person ----------
   oct 1 care baseline, oct 8 therapy goals, oct 15 medication change, oct 22 nutrition and hydration targets, and today's active shift handoff.
   the dates are real calendar dates, and if one would be in the future (app opened before oct 1) it uses last year so the history is always in the past.
*/
function buildPastDate(monthIndex, dayOfMonth, hour){
  const now = new Date();
  let d = new Date(now.getFullYear(), monthIndex, dayOfMonth, hour, 0, 0, 0);
  if(d.getTime() > now.getTime()) d = new Date(now.getFullYear() - 1, monthIndex, dayOfMonth, hour, 0, 0, 0);
  return d;
}
const careLog = (id, when, cat, title, details, highlights, by) => ({id, ts:when.toISOString(), cat, title, details, highlights, by:by.id, byName:by.name});

/*

*/
const KEY = 'carethread.local.v3';
let state;

const isStr = v => typeof v === 'string';
const isTs = v => isStr(v) && !isNaN(new Date(v).getTime());
const isStrList = v => Array.isArray(v) && v.every(isStr);
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
function validProfile(p){
  return isObj(p) && isStr(p.name) && (typeof p.age === 'number' || p.age === '') && isStrList(p.diagnoses) && isStrList(p.triggers) && isStrList(p.sensory) && isStr(p.emergency) &&
    Array.isArray(p.medications) && p.medications.every(m => isObj(m) && isStr(m.name) && isStr(m.dose) && isStr(m.when) && isStr(m.time)) &&
    Array.isArray(p.doctors) && p.doctors.every(d => isObj(d) && isStr(d.name) && isStr(d.role) && isStr(d.phone));
}
function validEntry(e){
  return isObj(e) && isStr(e.id) && isStr(e.rid) && isTs(e.ts) && isStr(e.by) && isStr(e.byName) && Number.isInteger(e.mood) && !!MOODS[e.mood] &&
    typeof e.meds === 'boolean' && typeof e.routine === 'boolean' && isStrList(e.behaviors) && isStrList(e.triggers) && typeof e.severity === 'number' && isStr(e.notes);
}
const validCareLog = l => isObj(l) && isStr(l.id) && isTs(l.ts) && !!LOG_CATEGORIES[l.cat] && isStr(l.title) && isStr(l.details) && isStrList(l.highlights) && isStr(l.by) && isStr(l.byName);
const validNote = n => isObj(n) && isStr(n.text) && isStr(n.byName) && isTs(n.ts) && isStrList(n.highlights);
const validDoses = d => isObj(d) && isStr(d.day) && isObj(d.done) && Object.values(d.done).every(r => isObj(r) && isStr(r.by) && isStr(r.byName) && isTs(r.at));
function validState(s){
  if(!isObj(s) || s.v !== 3) return false;
  const h = s.household;
  if(!isObj(h) || !isStr(h.name) || !isStr(h.code) || !Array.isArray(h.members) || !h.members.length) return false;
  if(!h.members.every(m => isObj(m) && isStr(m.id) && isStr(m.name) && (m.role === 'admin' || m.role === 'caregiver'))) return false;
  if(!Array.isArray(s.recipients) || !s.recipients.length || !s.recipients.every(r => isObj(r) && isStr(r.id) && validProfile(r.profile))) return false;
  if(!Array.isArray(s.entries) || !s.entries.every(validEntry)) return false;
  if(!isObj(s.carelogs) || !Object.values(s.carelogs).every(a => Array.isArray(a) && a.every(validCareLog))) return false;
  if(!isObj(s.notes) || !Object.values(s.notes).every(validNote)) return false;
  if(!isObj(s.doses) || !Object.values(s.doses).every(validDoses)) return false;
  if(!isObj(s.shifts) || !Object.values(s.shifts).every(x => isObj(x) && isStr(x.name) && isTs(x.at))) return false;
  return isStr(s.rid) && isStr(s.me) && isObj(s.reminders);
}
/* shift fields were added after the first version. old saves have no shiftlog and their "on shift" marker has no id. fill the gaps without making anything up (start times are never invented) and without failing the whole save. */
const validDoneShift = x => isObj(x) && isStr(x.sid) && isStr(x.rid) && isStr(x.id) && isStr(x.name) && isTs(x.at) && isTs(x.end) && (x.endedBy === undefined || isStr(x.endedBy));
function normalizeShifts(s){
  s.shiftLog = Array.isArray(s.shiftLog) ? s.shiftLog.filter(validDoneShift) : [];
  s.touched = isObj(s.touched) ? Object.fromEntries(Object.entries(s.touched).filter(([, v]) => v === true)) : {};
  const known = new Set(s.recipients.map(r => r.id));
  for(const rid of Object.keys(s.shifts)){
    const sh = s.shifts[rid];
    if(!known.has(rid)){ delete s.shifts[rid]; continue; }
    if(!isStr(sh.sid)) sh.sid = 'sh_old_' + new Date(sh.at).getTime().toString(36);
    if(!isStr(sh.id)) sh.id = '';
    sh.rid = rid; sh.status = 'active';
  }
  s.entries.forEach(e => { if('shift' in e && !isStr(e.shift)) delete e.shift; });
}
/* load order: saved data if it exists and passes the check, otherwise null (then the starting data is used) */
function loadState(){
  const raw = store.get(KEY);
  if(!raw) return null;
  try {
    const s = JSON.parse(raw);
    if(validState(s)){ normalizeShifts(s); return s; }
    console.warn('CareThread: saved data had an unexpected shape, so the starting data was restored.');
  } catch(e){ console.warn('CareThread: saved data could not be read, so the starting data was restored.'); }
  return null;
}
const save = () => store.set(KEY, JSON.stringify(state));

/* getters that keep "who am i" and "who am i caring for" in one place */
const me = () => state.household.members.find(m => m.id === state.me) || state.household.members[0];
const isAdmin = () => me().role === 'admin';
const R = () => state.recipients.find(r => r.id === state.rid) || state.recipients[0];
const prof = () => R().profile;
const entriesR = () => state.entries.filter(e => e.rid === R().id);
const entriesFor = key => entriesR().filter(e => dayKey(e.ts) === key).sort((a, b) => new Date(a.ts) - new Date(b.ts));
const todayKey = () => dayKey(new Date());
const canEdit = e => isAdmin() || e.by === me().id;
const careLogsR = () => (state.carelogs[R().id] ||= []);
const noteR = () => state.notes[R().id] || null;

/* today's medication sign-offs. if the saved day isn't today every dose starts as pending again (the timeline keeps yesterday's sign-offs as history). */
function dosesR(){
  const id = R().id;
  if(!state.doses[id] || state.doses[id].day !== todayKey()) state.doses[id] = {day:todayKey(), done:{}};
  return state.doses[id];
}
function rollDoses(){
  let changed = false;
  state.recipients.forEach(r => { const d = state.doses[r.id]; if(d && d.day !== todayKey()){ state.doses[r.id] = {day:todayKey(), done:{}}; changed = true; } });
  return changed;
}
const canUndoDose = rec => isAdmin() || rec.by === me().id;

state = loadState() || seedState();
rollDoses();
save();

/* === handoff summary (worked out here from today's entries, no internet) === */
function localSummary(es){
  const p = prof(), name = p.name;
  if(!es.length) return `Nothing has been logged for ${name} yet today. Check in with whoever was with ${name} last before you start.`;
  const m = avg(es.map(e => e.mood));
  const first = es[0], last = es[es.length - 1];
  const parts = [];
  const tone = m >= 4 ? 'a good day so far' : m >= 3 ? 'a fairly steady day so far' : m >= 2.2 ? 'a bumpy day so far' : 'a hard day so far';
  parts.push(es.length > 1 && first.mood !== last.mood
    ? `${name} is having ${tone}; mood has gone from ${MOODS[first.mood].label.toLowerCase()} to ${MOODS[last.mood].label.toLowerCase()} across ${plural(es.length, 'check-in')}.`
    : `${name} is having ${tone}.`);
  const medMiss = es.filter(e => !e.meds).length, routMiss = es.filter(e => !e.routine).length;
  if(medMiss) parts.push(`Heads up: medications were marked as not given in ${plural(medMiss, 'entry', 'entries')}, so double-check before the next dose.`);
  else parts.push('Medications have been logged as given.');
  if(routMiss) parts.push(`The routine got disrupted in ${plural(routMiss, 'entry', 'entries')}.`);
  const inc = es.filter(e => e.severity > 0);
  if(inc.length){
    const worst = inc.reduce((a, b) => b.severity > a.severity ? b : a);
    const snip = (worst.notes || '').split(/(?<=[.!?])\s/)[0] || '';
    parts.push(`There ${inc.length === 1 ? 'was one incident' : `were ${inc.length} incidents`} logged${snip ? ` (${worst.byName} noted: ${snip.replace(/\.$/, '')})` : ''}.`);
  } else {
    const trig = [...new Set(es.flatMap(e => e.triggers))];
    if(trig.length) parts.push(`Things that got in the way: ${trig.join(', ').toLowerCase()}.`);
  }
  if(last.mood <= 2) parts.push(`${name} was still having a rough time at the last check-in, so start with quiet time and low demands.`);
  else if(es.some(e => e.triggers.includes('Sleep disruption')) && p.sensory[0]) parts.push(`Watch for another rough night; ${p.sensory[0].charAt(0).toLowerCase() + p.sensory[0].slice(1)} tends to help.`);
  else {
    const evening = p.medications.find(x => /evening|night|bed/i.test(x.when));
    parts.push(evening ? `Next up: ${evening.name} around ${evening.time}.` : 'Nothing else to flag right now.');
  }
  return parts.slice(0, 5).join(' ');
}

/* === layer 2: pattern analysis (all calculated from the entries) === */
/* triggers a caregiver wrote about in a note but didn't tick. only careful phrases, and a phrase after "no", "not" or "without" is ignored so "no loud noises" never counts as noise. they are counted with the ticked triggers, and anywhere a total shows it says how many came from notes. */
const NOTE_TRIGGERS = [
  ['Sleep disruption', /\b(?:didn.?t sleep|did not sleep|barely slept|no sleep|poor sleep|slept (?:poorly|badly|very little)|bad night|rough night|restless night|up (?:all night|(?:\w+ )?times? (?:overnight|in the night|during the night)|twice (?:overnight|in the night))|awake (?:all|most of the) night|couldn.?t sleep|trouble (?:sleeping|falling asleep)|woke (?:up )?(?:at \d|every|several|often|multiple|early)|sleep disruption|insomnia)/gi],
  ['Schedule change', /\b(?:schedule (?:change|changed|was changed|shift)|routine (?:was )?(?:change|changed|disrupted|different)|(?:time|pickup|pick-up|plans?|appointment|bus|visit|meal|lunch|dinner)(?: time)? (?:was |were )?(?:moved|changed|delayed|rescheduled|cancel+ed)|ran (?:long|late|over)|different (?:time|bus|teacher|aide|caregiver|route|schedule)|substitute|last.?minute|rescheduled|unexpected change|without (?:warning|notice)|wasn.?t told (?:ahead|in advance))/gi],
  ['Noise', /\b(?:noise|noisy|loud|leaf blower|construction|fire drill|siren|fireworks|thunder|barking|drilling|jackhammer)/gi],
  ['Social interaction', /\b(?:visitors?|stopped by|came by|unannounced|unexpected (?:guest|visit)|guests?|company (?:came|over)|neighbou?r (?:stopped|came|visited)|relatives? (?:came|visited))/gi],
  ['Medical', /\b(?:sore|pain|grimac\w*|stomach ?ache|headache|fever|warm to the touch|a little warm|infection|nausea|nauseous|vomit\w*|dizzy|rash|cough\w*|nurse line|urgent care|doctor visit|saw the doctor|called the doctor)/gi]
];
const NEGATED = /(?:\b(?:no|not|never|without|none|nor|free of)\b|n['’]t\b)[^.!?;,]{0,22}$/i;
function noteTriggers(text){
  const t = String(text || ''), out = [];
  for(const [label, re] of NOTE_TRIGGERS){
    re.lastIndex = 0; let m;
    while((m = re.exec(t))){ if(!NEGATED.test(t.slice(Math.max(0, m.index - 28), m.index))){ out.push(label); break; } }
  }
  return out;
}
/* every trigger an entry shows: the ticked ones plus any its note describes. "noted" lists the ones only the note had. */
function triggersOf(e){ const noted = noteTriggers(e.notes).filter(t => !e.triggers.includes(t)); return {all:[...e.triggers, ...noted], noted}; }

function dayStats(days){
  const cutoff = new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate() - (days - 1));
  const by = {};
  entriesR().forEach(e => { const d = new Date(e.ts); if(d >= cutoff){ (by[dayKey(d)] ||= []).push(e); } });
  return Object.keys(by).sort().map(k => {
    const es = by[k], d = new Date(k + 'T12:00:00'), dow = d.getDay(), tr = es.map(triggersOf);
    const has = (label, ticked) => tr.some((t, i) => (ticked ? es[i].triggers : t.all).includes(label));
    return {
      key:k, date:d, n:es.length, avg:avg(es.map(e => e.mood)),
      sleep:has('Sleep disruption'), sched:has('Schedule change'), noise:has('Noise'),
      /* this day only counts because of a note, nobody ticked the trigger that day */
      sleepNote:has('Sleep disruption') && !has('Sleep disruption', true), schedNote:has('Schedule change') && !has('Schedule change', true), noiseNote:has('Noise') && !has('Noise', true),
      triggers:tr.flatMap(t => t.all), notedTriggers:tr.flatMap(t => t.noted),
      medsOk:es.filter(e => e.meds).length, incidents:es.filter(e => e.severity > 0).length,
      weekend:dow === 0 || dow === 6, es

  });
}
/* how many times each trigger shows up across the days, and how many of those only came from notes */
function triggerCounts(ds){
  const all = {}, noted = {};
  ds.forEach(d => { d.triggers.forEach(t => all[t] = (all[t] || 0) + 1); d.notedTriggers.forEach(t => noted[t] = (noted[t] || 0) + 1); });
  return {all, noted, ranked:Object.entries(all).sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0])), fromNotes:Object.values(noted).reduce((a, b) => a + b, 0)};
}
const isHard = d => d.avg <= 2.5;
function ratioInsight(ds, flag, label, id){
  const w = ds.filter(d => d[flag]), wo = ds.filter(d => !d[flag]);
  if(w.length < 2 || wo.length < 2) return null;
  const hw = w.filter(isHard).length, ho = wo.filter(isHard).length;
  const rw = hw / w.length, ro = ho / wo.length;
  if(hw === 0) return null;
  let big, text;
  if(ho === 0){ big = `${hw}/${w.length}`; text = `${hw} of ${w.length} days with ${label} were hard days (average mood 2.5 or below). Of ${wo.length} days without it, none were.`; }
  else {
    if(rw / ro < 1.4) return null;
    /* show raw counts and not a ratio, because a ratio like "15x" can come down to one single day in the comparison group */
    big = `${pct(hw, w.length)}% vs ${pct(ho, wo.length)}%`;
    text = `${hw} of ${w.length} days with ${label} were hard days (average mood 2.5 or below), compared with ${ho} of ${wo.length} days without it.`;
  }
  const strength = hw >= 4 && w.length >= 6 ? 'strong' : 'mod', fromNotes = ds.filter(d => d[flag + 'Note']).length;
  return {id, big, title:`${label[0].toUpperCase() + label.slice(1)} → harder days`, text, basis:`Based on ${ds.length} logged days${fromNotes ? `, including ${plural(fromNotes, 'day')} found in notes` : ''}`, strength};
}
function computeInsights(days){
  const ds = dayStats(days), out = [];
  if(ds.length < 5) return {ds, insights:[], note:'Log at least five days to start seeing patterns.'};
  const a = ratioInsight(ds, 'sleep', 'a logged sleep disruption', 'sleep'); if(a) out.push(a);
  const b = ratioInsight(ds, 'sched', 'a schedule change', 'sched'); if(b) out.push(b);
  const both = ds.filter(d => d.sleep && d.sched);
  if(both.length >= 2 && both.every(isHard)) out.push({id:'both', big:`${both.length}/${both.length}`, title:'Sleep disruption + schedule change together', text:`Every day with both a sleep disruption and a schedule change was a hard day (${both.length} of ${both.length}). Two stressors in one day seems to be the tipping point.`, basis:`Based on ${ds.length} logged days`, strength:both.length >= 3 ? 'strong' : 'mod'});
  const allE = ds.flatMap(d => d.es), medsPct = pct(allE.filter(e => e.meds).length, allE.length);
  out.push({id:'meds', big:medsPct + '%', title:'Medication consistency', text:`Medications were logged as given in ${medsPct}% of entries. ${medsPct >= 90 ? 'That’s steady.' : 'There’s room to tighten this up. A missed dose is worth mentioning to the doctor.'}`, basis:`Based on ${allE.length} entries`, strength:medsPct >= 90 ? 'strong' : 'mod'});
  const tcs = triggerCounts(ds), top = tcs.ranked.slice(0, 2);
  if(top.length) out.push({id:'trig', big:String(top[0][1]), title:'Most common trigger', text:`${top[0][0]} showed up ${top[0][1]} times${top[1] ? `, followed by ${top[1][0].toLowerCase()} (${top[1][1]})` : ''}.`, basis:`Based on ${allE.length} entries${tcs.fromNotes ? `, including ${plural(tcs.fromNotes, 'mention')} found in notes` : ''}`, strength:top[0][1] >= 5 ? 'strong' : 'mod'});
  const wk = ds.filter(d => d.weekend), sc = ds.filter(d => !d.weekend);
  if(wk.length >= 3 && sc.length >= 3){
    const aw = avg(wk.map(d => d.avg)), as = avg(sc.map(d => d.avg));
    if(Math.abs(aw - as) >= 0.3) out.push({id:'wk', big:`${aw.toFixed(1)} vs ${as.toFixed(1)}`, title:aw > as ? 'Weekends are easier' : 'Weekdays are easier', text:`Average mood is ${aw.toFixed(1)} on weekends versus ${as.toFixed(1)} on weekdays.`, basis:`${wk.length} weekend days, ${sc.length} weekdays`, strength:Math.abs(aw - as) >= 0.5 ? 'strong' : 'mod'});
  }
  const slots = {Morning:[], Afternoon:[], Evening:[]};
  allE.forEach(e => { const h = new Date(e.ts).getHours(); slots[h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening'].push(e.mood); });
  const sl = Object.entries(slots).filter(([, v]) => v.length >= 4).map(([k, v]) => [k, avg(v)]).sort((x, y) => x[1] - y[1]);
  if(sl.length >= 2 && sl[sl.length - 1][1] - sl[0][1] >= 0.3) out.push({id:'tod', big:sl[0][0], title:'Hardest part of the day', text:`${sl[0][0]} check-ins average ${sl[0][1].toFixed(1)}, compared with ${sl[sl.length - 1][1].toFixed(1)} for ${sl[sl.length - 1][0].toLowerCase()}.`, basis:`Based on ${allE.length} entries`, strength:sl[sl.length - 1][1] - sl[0][1] >= 0.5 ? 'strong' : 'mod'});
  return {ds, insights:out, note:''};
}

/* ---------- charts (drawn by hand in svg, no library) ---------- */
/* both charts go by calendar date, so a day with no entries shows as a gap and is never skipped. (counting "7 days" in logged days would stretch them over more calendar days without saying) */
const periodStart = days => { const s = startOfDay(new Date()); s.setDate(s.getDate() - (days - 1)); return s; };
function lineChart(ds, days){
  const W = 640, H = 240, L = 36, R_ = 14, T = 14, B = 30;
  if(ds.length < 2) return '<div class="empty">Not enough days yet.</div>';
  const start = periodStart(days), span = Math.max(1, days - 1), at = d => daysBetween(start, d.date);
  const x = i => L + (W - L - R_) * i / span, y = v => T + (H - T - B) * (5 - v) / 4;
  let g = '';
  for(let v = 1; v <= 5; v++) g += `<line x1="${L}" x2="${W - R_}" y1="${y(v)}" y2="${y(v)}" stroke="#E3DCD0" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#5C636E">${v}</text>`;
  const band = `<rect x="${L}" y="${y(2.5)}" width="${W - L - R_}" height="${y(1) - y(2.5)}" fill="#C62F2F" opacity=".07"/><text x="${W - R_ - 4}" y="${y(1) - 6}" text-anchor="end" font-size="10.5" fill="#B02A2A" font-weight="700">difficult-day zone (2.5 or below)</text>`;
  const path = ds.map((d, i) => `${i ? 'L' : 'M'}${x(at(d)).toFixed(1)} ${y(d.avg).toFixed(1)}`).join(' ');
  /* the trend on a day is the average of the daily averages in the 7 calendar days ending on it */
  const ma = ds.map((d, i) => { const w = ds.filter(q => at(q) <= at(d) && at(q) > at(d) - 7); return `${i ? 'L' : 'M'}${x(at(d)).toFixed(1)} ${y(avg(w.map(q => q.avg))).toFixed(1)}`; }).join(' ');
  const pts = ds.map(d => {
    const hard = isHard(d), t = `${fmtShort(d.date)}: average mood ${d.avg.toFixed(1)} from ${plural(d.n, 'check-in')}${hard ? ' (difficult day)' : ''}`;
    return `<circle cx="${x(at(d)).toFixed(1)}" cy="${y(d.avg).toFixed(1)}" r="${hard ? 5.5 : 4.2}" fill="${hard ? '#C62F2F' : '#2563C9'}" stroke="#FFFDF9" stroke-width="1.5"><title>${esc(t)}</title></circle>`;
  }).join('');
  const lab = [0, Math.floor(span / 2), span].map(i => { const d = new Date(start); d.setDate(d.getDate() + i); return `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === span ? 'end' : 'middle'}" font-size="11" fill="#5C636E">${fmtShort(d)}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily average mood from ${fmtShort(start)} to ${fmtShort(new Date())}. Blue dots are daily averages, red dots are difficult days, and the orange line is the 7-day trend.">${band}${g}<path d="${path}" fill="none" stroke="#9DB4D6" stroke-width="1.5" opacity=".7"/><path d="${ma}" fill="none" stroke="#E8751A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts}${lab}</svg>`;
}
/* the period cut into calendar weeks, oldest first. each one holds the logged days in it (a week with none is kept and says "no entries") */
function weekBuckets(ds, days){
  const start = periodStart(days), n = Math.ceil(days / 7);
  const weeks = Array.from({length:n}, (_, k) => { const s = new Date(start); s.setDate(s.getDate() + 7 * k); const e = new Date(s); e.setDate(e.getDate() + 6); return {start:s, end:e > new Date() ? new Date() : e, days:[]}; });
  ds.forEach(d => { const k = Math.min(n - 1, Math.floor(daysBetween(start, d.date) / 7)); if(k >= 0) weeks[k].days.push(d); });
  return weeks;
}
/* valfn(week) gives a number, or null if the week has no entries. tipfn(week, value) is the hover and screen reader text */
function weeklyBars(weeks, valFn, fmt, tipFn, color, max, ariaLabel){
  const W = 640, H = 190, L = 36, R_ = 14, T = 16, B = 30;
  const vals = weeks.map(valFn), m = max || Math.max(1, ...vals.map(v => v || 0));
  const bw = (W - L - R_) / weeks.length;
  const bars = weeks.map((w, i) => {
    const v = vals[i], bx = L + i * bw + bw * 0.2, cx = bx + bw * 0.3, label = `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="11" fill="#5C636E">${fmtShort(w.start)}</text>`;
    if(v === null) return `<line x1="${bx}" x2="${bx + bw * 0.6}" y1="${H - B - 1}" y2="${H - B - 1}" stroke="#B7AE9E" stroke-width="2" stroke-dasharray="4 4"><title>${esc(tipFn(w, v))}</title></line><text x="${cx}" y="${H - B - 8}" text-anchor="middle" font-size="11" fill="#5C636E">no entries</text>${label}`;
    const h = (H - T - B) * v / m;
    return `<rect x="${bx}" y="${H - B - h}" width="${bw * 0.6}" height="${Math.max(h, 1)}" rx="6" fill="${color}"><title>${esc(tipFn(w, v))}</title></rect><text x="${cx}" y="${H - B - h - 5}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1A1F2E">${esc(fmt(v))}</text>${label}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ariaLabel)}"><line x1="${L}" x2="${W - R_}" y1="${H - B}" y2="${H - B}" stroke="#E3DCD0"/>${bars}</svg>`;
}

/* like "jordan · today 3:10 pm" */
const postedLabel = n => `${n.byName} · ${relDay(n.ts)} ${fmtTime(n.ts)}`;
let handoffDraft = '';                 // text typed in the handoff box but not posted yet, it stays when the screen redraws
let justPosted = false;                 // true for one render after a new handoff note so the card can settle in
const freshIds = new Set();             // ids of care log entries added just now so they can slide in once

/*
   ---------- "today's entries at a glance", written by the ai from the real entries ----------
   with no entries, or whenever the ai can't be reached, the built in localsummary() is shown so the card never goes blank.
   a written summary is saved (in this browser only) with the exact entries it came from, and it only shows while those entries are the same. adding, editing or deleting an entry makes it old and a new one is asked for.
   sent: today's entries (time, mood, meds, routine, behaviors, triggers, severity and the note text) with the person's first name swapped for [name]. notes are free text so other names typed in them are sent as written.
*/
const GLANCE_KEY = 'carethread.glance.v1';
let glanceCache = (() => { try { const o = JSON.parse(store.get(GLANCE_KEY) || '{}'); return isObj(o) ? Object.fromEntries(Object.entries(o).filter(([, v]) => isObj(v) && isStr(v.sig) && isStr(v.text) && isTs(v.at))) : {}; } catch { return {}; } })();
const saveGlance = () => store.set(GLANCE_KEY, JSON.stringify(glanceCache));
let glanceTimer = 0, glanceSeq = 0, glanceBusy = false, glanceFailed = false, glanceMap = [];
/* real names go back in. a placeholder the ai made up or messed up is never shown as raw brackets */
const glanceFill = t => restoreMap(t, glanceMap).replace(/\[(MED|CONDITION|DOCTOR)\d*\]|\[(?:medication|condition|doctor)\]/gi, (m, k) => ({MED:'her medication', CONDITION:'her condition', DOCTOR:'the doctor'})[(k || m.slice(1, -1)).toUpperCase().replace(/^MEDICATION$/, 'MED')] || '').replace(/\[NAME\]/g, () => prof().name).replace(/\s{2,}/g, ' ');

function glancePayload(){
  const es = entriesFor(todayKey()); if(!es.length) return null;
  /* notes are free text, so the name and the medication, condition and doctor names from the care profile get swapped for numbered placeholders (best effort, a misspelling or a drug that isn't listed would still get through). the map stays on this device and puts the real words back into the ai's answer on screen. */
  const scr = makeScrubber(); glanceMap = scr.map; const scrub = scr.scrub;
  const sc = (list, n, len) => [...new Set(list.map(x => scrub(x).slice(0, len)).filter(Boolean))].slice(0, n);
  const today = todayKey(), byDay = {};
  entriesR().forEach(e => { const k = dayKey(e.ts); if(k !== today && daysBetween(new Date(k + 'T12:00:00'), new Date()) <= 7) (byDay[k] ||= []).push(e); });
  const recentDays = Object.keys(byDay).sort().slice(-7).map(k => { const d = byDay[k]; return {date:k, avgMood:Math.round(avg(d.map(e => e.mood)) * 10) / 10, checkIns:Math.min(d.length, 30), triggers:sc(d.flatMap(e => e.triggers), 4, 40), behaviors:sc(d.flatMap(e => e.behaviors), 3, 30), incidents:Math.min(d.filter(e => e.severity > 0).length, 30)}; });
  return {v:1, task:'glance', person:{ageGroup:aiAgeGroup(prof().age)}, total:Math.min(es.length, 500), triggers:sc(prof().triggers, 6, 100), comfort:sc(prof().sensory, 6, 120), recentDays,
    entries:es.slice(-12).map(e => ({time:`${pad(new Date(e.ts).getHours())}:${pad(new Date(e.ts).getMinutes())}`, mood:e.mood, meds:e.meds, routine:e.routine, behaviors:e.behaviors.slice(0, 4), triggers:e.triggers.slice(0, 4), severity:e.severity, notes:scrub(e.notes).slice(0, 300)}))};
}
function glanceView(){
  const pl = glancePayload(), c = pl && glanceCache[R().id];
  if(c && c.sig === JSON.stringify(pl)){ return {ai:true, at:c.at, text:glanceFill(c.text), mindful:(c.mindful || []).map(glanceFill)}; }
  return {ai:false, has:!!pl, text:localSummary(entriesFor(todayKey())), mindful:[]};
}
function glanceTag(g){
  if(glanceBusy) return '<span class="tiny muted">Updating from the latest entries…</span>';
  if(g.ai) return `<span class="chip a">AI-written from today’s entries</span> <span class="tiny muted">${esc(fmtTime(g.at))}</span>`;
  return glanceFailed && g.has ? '<span class="tiny muted">Showing the built-in summary. The AI summary isn’t available right now.</span> <button type="button" class="linkbtn" data-act="retry-glance">Try again</button>' : '';
}
function paintGlance(){                       // update the card in place so a redraw never steals focus from a note being typed
  const t = $('#glance-text'); if(!t) return;
  const g = glanceView(); t.textContent = g.text;
  const tag = $('#glance-tag'); if(tag) tag.innerHTML = glanceTag(g);
  document.querySelectorAll('.mindful-ai').forEach(el => { el.innerHTML = mindfulHtml(g); });
}
/* reminders from the person's profile and recent days by the ai. the profile's own triggers and the next medication always stay as the default */
const mindfulHtml = g => g.ai && g.mindful.length ? `<p class="tiny muted" style="margin:12px 0 6px">From recent days <span class="chip a">AI</span></p><ul class="clean">${g.mindful.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : '';
const scheduleGlance = () => { clearTimeout(glanceTimer); glanceTimer = setTimeout(refreshGlance, 700); };   // wait a moment so quick edits only make one request
async function refreshGlance(){
  const pl = glancePayload(); if(!pl) { glanceFailed = false; paintGlance(); return; }
  const rid = R().id, sig = JSON.stringify(pl);
  if(glanceCache[rid] && glanceCache[rid].sig === sig) return;
  if(location.protocol === 'file:' || navigator.onLine === false){ glanceFailed = true; paintGlance(); return; }
  const mine = ++glanceSeq, ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 30000);
  glanceBusy = true; glanceFailed = false; paintGlance();
  try {
    const res = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:sig, signal:ctl.signal});
    let data = null; try { data = await res.json(); } catch {}
    if(mine !== glanceSeq) return;                                  // a newer request took over
    if(res.ok && data && data.ok === true && isObj(data.glance) && isStr(data.glance.summary) && data.glance.summary.trim()){ glanceCache[rid] = {sig, text:data.glance.summary.trim(), at:new Date().toISOString(), mindful:Array.isArray(data.glance.mindful) ? data.glance.mindful.filter(isStr).slice(0, 3) : []}; saveGlance(); }
    else glanceFailed = true;
  } catch { if(mine === glanceSeq) glanceFailed = true; }
  finally { clearTimeout(timer); if(mine === glanceSeq){ glanceBusy = false; paintGlance(); } }
}

/* the medication tracker: #medication-list. each dose is pending until a caregiver taps it, then it says taken with their signature and time. tapping also adds a "sign-off" entry to the care timeline. */
function medTracker(){
  const meds = prof().medications, done = dosesR().done;
  const taken = meds.filter(m => done[medKey(m)]).length, total = meds.length;
  const rows = meds.map(m => {
    const key = medKey(m), rec = done[key], isTaken = !!rec;
    const action = isTaken
      ? `<button type="button" class="statebtn" data-status="taken" disabled aria-label="${esc(m.name)} has been taken">Taken</button>
         <span class="signline">Signed: ${esc(rec.byName)} · ${fmtTime(rec.at)}</span>
         ${canUndoDose(rec) ? `<button type="button" class="linkbtn" data-act="undo-dose" data-key="${esc(key)}" aria-label="Undo sign-off for ${esc(m.name)}">Undo</button>` : ''}`
      : `<button type="button" class="statebtn" data-status="pending" data-act="sign-dose" data-key="${esc(key)}" aria-label="Mark ${esc(m.name)} as taken">Pending</button>`;

/* the next dose that hasn't been signed off yet today */
function nextMed(){
  const cur = new Date().getHours() * 60 + new Date().getMinutes(), done = dosesR().done;
  const pending = prof().medications.filter(m => !done[medKey(m)]);
  if(!prof().medications.length) return '<span class="muted">No schedule on file</span>';
  if(!pending.length) return '<span class="muted">All of today’s doses are signed off</span>';
  const list = pending.map(m => ({m, t:timeToMinutes(m.time)})).filter(x => x.t !== null).sort((a, b) => a.t - b.t);
  if(!list.length) return pending.map(m => `<b>${esc(m.name)} ${esc(m.dose)}</b>`).join(', ');
  const t0 = (list.find(x => x.t >= cur) || list[0]).t;
  const group = list.filter(x => x.t === t0);
  return `<b>${group.map(x => `${esc(x.m.name)} ${esc(x.m.dose)}`).join(', ')}</b> at ${esc(group[0].m.time)}${t0 < cur ? ' <span class="muted">(overdue)</span>' : ''}`;
}

/*
   === shifts ===
   one active shift per person (state.shifts[personid]) and a list of finished ones (state.shiftlog).
   starting a shift doesn't need an entry first. ending it stamps the end time and moves it to the history.
   entries made by the person on shift, at or after the start, carry that shift's id (entry.shift).
   entries made outside a shift carry none, and handoff notes never depend on a shift.
   everything is in this browser's localstorage like the rest of the app.
*/
const shiftR = () => state.shifts[R().id] || null;
const fmtDur = ms => { const m = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(m / 60); return h ? `${h} hr ${m % 60} min` : m ? `${m} min` : 'under a minute'; };
const shiftDur = s => new Date(s.end).getTime() - new Date(s.at).getTime();
const shiftEntries = sid => state.entries.filter(e => e.shift === sid).sort((a, b) => new Date(a.ts) - new Date(b.ts));
const shiftSpan = s => `${fmtShort(s.at)}, ${fmtTime(s.at)} to ${dayKey(s.at) === dayKey(s.end) ? '' : fmtShort(s.end) + ', '}${fmtTime(s.end)}`;
/* an entry is only attached to the shift if the person logging it is the one on shift and the time isn't before the shift began (compared by the minute because entry times are whole minutes) */
const shiftTag = when => { const sh = shiftR(); return sh && sh.id === me().id && when.getTime() >= Math.floor(new Date(sh.at).getTime() / 60000) * 60000 ? {shift:sh.sid} : {}; };
let justEnded = null;       // id of the shift that just ended so the handoff screen can confirm it once
window.addEventListener('hashchange', () => { justEnded = null; });

function finishShift(rid, by){
  const sh = state.shifts[rid]; if(!sh) return null;
  const now = new Date().toISOString(), done = {sid:sh.sid, rid, id:sh.id, name:sh.name, at:sh.at, end:new Date(now) < new Date(sh.at) ? sh.at : now};
  if(by.id !== sh.id) done.endedBy = by.name;
  state.shiftLog.push(done);
  if(state.shiftLog.length > 200) state.shiftLog.splice(0, state.shiftLog.length - 200);     // keeps the saved data small
  delete state.shifts[rid];
  return done;
}
function startShift(){
  const rid = R().id, who = me(), cur = state.shifts[rid];
  if(cur){                                              // never a second active shift for the same person
    toast(cur.id === who.id ? `Your shift with ${prof().name} is already active.` : `${cur.name} is already on shift with ${prof().name}.`);
    render(true); return;
  }
  state.shifts[rid] = {sid:uid('sh'), rid, id:who.id, name:who.name, at:new Date().toISOString(), status:'active'};
  justEnded = null; markChanged(rid); pendingFocus = '[data-act="end-shift"]'; save(); render(true); toast(`You’re on shift, ${who.name}.`);
}
function endShift(){
  const sh = shiftR(), who = me();
  if(!sh || !(sh.id === who.id || isAdmin())) return;
  const done = finishShift(R().id, who);
  justEnded = done.sid; handoffOpen = false; markChanged(R().id); pendingFocus = '#shift-done'; save(); render(true); toast('Shift ended.');
}
function takeOverShift(){
  const sh = shiftR(), who = me();
  if(!sh || sh.id === who.id) return;
  if(!confirm(`End ${sh.name}’s shift with ${prof().name} now and start yours?`)) return;
  finishShift(R().id, who); startShift();
}
function openHistory(){
  const sec = $('#shift-history'); if(!sec) return;
  const d = sec.querySelector('details'); if(d) d.open = true;
  sec.scrollIntoView({behavior:reducedMotion() ? 'auto' : 'smooth', block:'start'});
  const f = sec.querySelector('summary'); if(f) f.focus({preventScroll:true});
}
/* the "so far" time on the handoff screen counts up without redrawing the page */
function tickElapsed(){ document.querySelectorAll('[data-since]').forEach(el => { el.textContent = fmtDur(Date.now() - new Date(el.dataset.since).getTime()); }); }
setInterval(tickElapsed, 30000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') tickElapsed(); });

/* one line on the log screen that says clearly whether the entry will belong to a shift */
function shiftHint(){

  if(sh) return `${esc(sh.name)} is on shift with ${esc(prof().name)}. This entry is saved under your name and is not added to their shift.`;
  return 'You’re not on a shift, so this entry is saved on its own. You can start a shift on the Handoff screen whenever you like.';
}

const AI_ENDPOINT = '/api/care-insights';
const aiIdle = () => ({status:'idle', rid:null, range:null, reflection:null, message:'', at:null, sig:null});   // sig: the exact summary the reflection was written from

/* a short plain read of the pattern findings, built from the calculated insights (no outside service) */
function plainWords(insights, p){
  const get = id => insights.find(i => i.id === id), out = [], nm = p.name;
  if(get('both')) out.push(`The hardest days for ${nm} are the ones where a rough night and a change to the schedule land together.`);
  else if(get('sleep')) out.push(`Poor sleep tends to be followed by a harder day for ${nm}.`);

async function requestAiReflection(){

  const show = next => { if(mine !== aiSeq) return; ai = Object.assign(aiIdle(), next, {rid, range:rng}); pendingFocus = '#ai-status'; if(route().name === 'patterns') render(true); };
  const fail = message => show({status:'error', message});

  if(navigator.onLine === false) return fail('You appear to be offline. Reconnect and try again. Everything else in CareThread still works without a connection.');
